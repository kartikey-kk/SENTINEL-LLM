[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelllm"
version = "0.1.0"
description = "Python SDK for the SentinelLLM LLM firewall"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["sentinelllm"]
